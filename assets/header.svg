<svg fill="none" viewBox="0 0 900 240" width="100%" height="240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="50%" stop-color="#120505"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>

    <!-- Red Gradient for Accents -->
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="50%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#F87171"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" stop-opacity="0.8"/>
      <stop offset="25%" stop-color="#27272A" stop-opacity="0.3"/>
      <stop offset="75%" stop-color="#27272A" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="pillBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F0F11" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Subtle Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
    </filter>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#27272A" stroke-width="0.7" stroke-opacity="0.25"/>
      <circle cx="0" cy="0" r="1" fill="#DC2626" fill-opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Container Box with Rounded Corners -->
  <rect width="900" height="240" rx="14" fill="url(#bgGradient)"/>

  <!-- Background Grid -->
  <rect width="900" height="240" rx="14" fill="url(#grid)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="120" cy="40" r="90" fill="#DC2626" fill-opacity="0.12" filter="url(#glow)"/>
  <circle cx="820" cy="180" r="110" fill="#EF4444" fill-opacity="0.1" filter="url(#glow)"/>
  <circle cx="450" cy="120" r="130" fill="#7F1D1D" fill-opacity="0.08" filter="url(#glow)"/>

  <!-- Outer Border with Glowing Edges -->
  <rect x="1" y="1" width="898" height="238" rx="13" fill="none" stroke="url(#borderGradient)" stroke-width="1.5"/>

  <!-- Top Status Indicator Pill -->
  <g transform="translate(48, 30)">
    <rect width="270" height="26" rx="13" fill="url(#pillBg)" stroke="#27272A" stroke-width="1"/>
    <circle cx="16" cy="13" r="4.5" fill="#22C55E">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="17" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" letter-spacing="0.5">
      OPEN TO FULL-TIME OPPORTUNITIES
    </text>
  </g>

  <!-- Main Name Title -->
  <g transform="translate(48, 105)">
    <!-- Glow Effect Behind Name -->
    <text x="0" y="0" fill="#DC2626" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="1.5" opacity="0.35" filter="url(#textGlow)">
      ANIL H
    </text>
    <text x="0" y="0" fill="#F3F4F6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="1.5">
      ANIL <tspan fill="url(#redAccent)">H</tspan>
    </text>
  </g>

  <!-- Professional Subtitle / Positioning -->
  <g transform="translate(48, 138)">
    <text x="0" y="0" fill="#EF4444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" letter-spacing="2">
      JAVA DEVELOPER
    </text>
    <circle cx="158" cy="-4" r="2.5" fill="#52525B"/>
    <text x="172" y="0" fill="#F3F4F6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" letter-spacing="2">
      FULL STACK DEVELOPER
    </text>
    <circle cx="395" cy="-4" r="2.5" fill="#52525B"/>
    <text x="409" y="0" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" letter-spacing="2">
      PROBLEM SOLVER
    </text>
  </g>

  <!-- Tech Stack Feature Pills -->
  <g transform="translate(48, 172)">
    <!-- Pill 1: Core Java & OOP -->
    <g transform="translate(0, 0)">
      <rect width="112" height="28" rx="6" fill="#18181B" stroke="#27272A" stroke-width="1"/>
      <circle cx="14" cy="14" r="3.5" fill="#DC2626"/>
      <text x="25" y="18" fill="#F3F4F6" font-family="monospace, 'Segoe UI', sans-serif" font-size="12" font-weight="600">Core Java</text>
    </g>

    <!-- Pill 2: Spring Boot -->
    <g transform="translate(122, 0)">
      <rect width="124" height="28" rx="6" fill="#18181B" stroke="#27272A" stroke-width="1"/>
      <circle cx="14" cy="14" r="3.5" fill="#DC2626"/>
      <text x="25" y="18" fill="#F3F4F6" font-family="monospace, 'Segoe UI', sans-serif" font-size="12" font-weight="600">Spring Boot</text>
    </g>

    <!-- Pill 3: REST APIs -->
    <g transform="translate(256, 0)">
      <rect width="112" height="28" rx="6" fill="#18181B" stroke="#27272A" stroke-width="1"/>
      <circle cx="14" cy="14" r="3.5" fill="#DC2626"/>
      <text x="25" y="18" fill="#F3F4F6" font-family="monospace, 'Segoe UI', sans-serif" font-size="12" font-weight="600">REST APIs</text>
    </g>

    <!-- Pill 4: React.js -->
    <g transform="translate(378, 0)">
      <rect width="102" height="28" rx="6" fill="#18181B" stroke="#27272A" stroke-width="1"/>
      <circle cx="14" cy="14" r="3.5" fill="#DC2626"/>
      <text x="25" y="18" fill="#F3F4F6" font-family="monospace, 'Segoe UI', sans-serif" font-size="12" font-weight="600">React.js</text>
    </g>

    <!-- Pill 5: MySQL -->
    <g transform="translate(490, 0)">
      <rect width="90" height="28" rx="6" fill="#18181B" stroke="#27272A" stroke-width="1"/>
      <circle cx="14" cy="14" r="3.5" fill="#DC2626"/>
      <text x="25" y="18" fill="#F3F4F6" font-family="monospace, 'Segoe UI', sans-serif" font-size="12" font-weight="600">MySQL</text>
    </g>

    <!-- Pill 6: DSA -->
    <g transform="translate(590, 0)">
      <rect width="170" height="28" rx="6" fill="#18181B" stroke="#DC2626" stroke-width="1" stroke-opacity="0.6"/>
      <circle cx="14" cy="14" r="3.5" fill="#EF4444"/>
      <text x="25" y="18" fill="#F3F4F6" font-family="monospace, 'Segoe UI', sans-serif" font-size="12" font-weight="600">DSA &amp; Problem Solving</text>
    </g>
  </g>

  <!-- Decorative Corner Brackets / Terminal Accent on Top Right -->
  <g transform="translate(730, 32)">
    <rect width="122" height="66" rx="8" fill="#120505" stroke="#27272A" stroke-width="1"/>
    <text x="14" y="24" fill="#A1A1AA" font-family="monospace" font-size="11">const role = {</text>
    <text x="22" y="40" fill="#EF4444" font-family="monospace" font-size="11">  type: "Dev",</text>
    <text x="22" y="54" fill="#F3F4F6" font-family="monospace" font-size="11">  status: "Ready"</text>
    <text x="14" y="62" fill="#A1A1AA" font-family="monospace" font-size="11">};</text>
  </g>
</svg>

