<svg fill="none" viewBox="0 0 800 20" width="100%" height="20" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626" stop-opacity="0"/>
      <stop offset="20%" stop-color="#DC2626" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#EF4444" stop-opacity="1"/>
      <stop offset="80%" stop-color="#DC2626" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#DC2626" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowDiv" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
    </filter>
  </defs>
  <!-- Background Glow -->
  <line x1="100" y1="10" x2="700" y2="10" stroke="#DC2626" stroke-width="3" stroke-opacity="0.4" filter="url(#glowDiv)"/>
  <!-- Sharp Line -->
  <line x1="50" y1="10" x2="750" y2="10" stroke="url(#divGrad)" stroke-width="1.5"/>
  <!-- Center Diamond Accent -->
  <polygon points="400,6 404,10 400,14 396,10" fill="#EF4444"/>
</svg>

