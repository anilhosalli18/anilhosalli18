name: Generate Contribution Snake

on:
  schedule:
    # Run every 24 hours at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: anilhosalli18
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#DC2626&color_dots=#18181B,#450A0A,#7F1D1D,#B91C1C,#EF4444
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#DC2626&color_dots=#18181B,#450A0A,#7F1D1D,#B91C1C,#EF4444

      - name: Push github-contribution-grid-snake.svg to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

